name: Test, build and deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "benchmark/**"
      - "results/**"
      - "novels/**"
      - "runner/**"
      - "site/**"
      - "scripts/**"
      - "tests/**"
      - "config.yaml"
      - "pytest.ini"
      - "requirements*.txt"
      - ".github/workflows/generate.yml"
  pull_request:
    paths:
      - "benchmark/**"
      - "results/**"
      - "novels/**"
      - "runner/**"
      - "site/**"
      - "scripts/**"
      - "tests/**"
      - "config.yaml"
      - "pytest.ini"
      - "requirements*.txt"
      - ".github/workflows/generate.yml"

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked test and build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run the complete pytest suite
        run: python -m pytest -q

      - name: Build Pages artifact offline from tracked data
        env:
          API_URL: ""
          API_KEY: ""
        run: python -B scripts/generate_site.py --docs-dir _site

      - name: Verify complete artifact
        run: test -f _site/index.html && test -f _site/assets/style.css && test -f _site/assets/leaderboard.js

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
