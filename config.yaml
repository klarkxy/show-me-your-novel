# show-me-your-novel V2.1
#
# The endpoint and credential live in API_URL and API_KEY.  This file contains
# environment-variable names only; no credential value belongs in the repo.

version: 2

providers:
  new-api:
    base_url_env: API_URL
    api_key_env: API_KEY
    timeout: 600
    # Streaming is a transport choice, not a sampling control. The client
    # reconstructs a complete response and rejects streams without a terminal
    # event before the generation/scoring state machines can accept them.
    stream: true
    request_defaults: {}

# Generation controls intentionally stay empty so the upstream model uses its
# normal defaults for reasoning, temperature, and response format. Most models
# use Chat Completions; MiniMax and Claude explicitly select Anthropic Messages.
# Its required max_tokens is protocol metadata, not a chapter-length policy.
x-generation-defaults: &generation-defaults
  provider: new-api
  # Use a conservative common budget even when the upstream model supports
  # more. The runner refuses a request above 85% of this configured window.
  context_window: 131072
  request: {}
  stages: {}

models:
  - <<: *generation-defaults
    id: deepseek-v4-flash
    name: DeepSeek V4 Flash
    model: deepseek-v4-flash
    aliases: [deepseek-flash]
    # The provider keeps the wire id stable across backend refreshes. Bump this
    # opaque provenance marker whenever that backend changes so V2.1 starts a
    # genuinely fresh, independently auditable run instead of resuming the old
    # same-id checkpoint.
    revision: "2026-08-03"

  - <<: *generation-defaults
    id: deepseek-v4-pro
    name: DeepSeek V4 Pro
    model: deepseek-v4-pro
    aliases: [deepseek-pro]
    # The upstream behind this stable wire ID changed. Bump the immutable run
    # identity so the next successful publication archives the previous draft.
    revision: "2026-08-13"

  - <<: *generation-defaults
    id: mimo-v2.5
    name: MiMo V2.5
    model: mimo-v2.5
    aliases: [mimo]

  - <<: *generation-defaults
    id: mimo-v2.5-pro
    name: MiMo V2.5 Pro
    model: mimo-v2.5-pro
    aliases: [mimo-pro]

  - <<: *generation-defaults
    id: minimax-m3
    name: MiniMax M3
    model: minimax-m3
    aliases: [minimax]
    protocol: anthropic-messages
    protocol_required:
      max_tokens: 204800
    context_window: 204800

  - <<: *generation-defaults
    id: glm-5.2
    name: GLM 5.2
    model: glm-5.2
    aliases: [glm]

  - <<: *generation-defaults
    id: gpt-5.6-luna
    name: GPT-5.6 Luna
    model: gpt-5.6-luna
    aliases: [luna]

  - <<: *generation-defaults
    id: gpt-5.6-sol
    name: GPT-5.6 Sol
    model: gpt-5.6-sol
    aliases: [gpt-sol]

  - <<: *generation-defaults
    id: gpt-5.6-terra
    name: GPT-5.6 Terra
    model: gpt-5.6-terra
    aliases: [terra]

  - <<: *generation-defaults
    id: claude-haiku-4-5
    name: Claude Haiku 4.5
    model: claude-haiku-4-5
    aliases: [haiku]
    protocol: anthropic-messages
    protocol_required:
      max_tokens: 65536

  - <<: *generation-defaults
    id: claude-fable-5
    name: Claude Fable 5
    model: claude-fable-5
    aliases: [fable]
    protocol: anthropic-messages
    protocol_required:
      max_tokens: 65536

  - <<: *generation-defaults
    id: claude-sonnet-4-6
    name: Claude Sonnet 4.6
    model: claude-sonnet-4-6
    aliases: [sonnet-4.6]
    protocol: anthropic-messages
    protocol_required:
      max_tokens: 65536

  - <<: *generation-defaults
    id: claude-sonnet-5
    name: Claude Sonnet 5
    model: claude-sonnet-5
    aliases: [sonnet]
    protocol: anthropic-messages
    protocol_required:
      max_tokens: 65536

  - <<: *generation-defaults
    id: gemini-2.5-pro
    name: Gemini 2.5 Pro
    model: gemini-2.5-pro
    aliases: [gemini-2.5]

  - <<: *generation-defaults
    id: gemini-3.1-pro
    name: Gemini 3.1 Pro
    model: gemini-3.1-pro
    aliases: [gemini-pro]

  - <<: *generation-defaults
    id: gemini-3.5-flash
    name: Gemini 3.5 Flash
    model: gemini-3.5-flash
    aliases: [gemini-flash]

  - <<: *generation-defaults
    id: gemini-3.6-flash
    name: Gemini 3.6 Flash
    model: gemini-3.6-flash
    aliases: [gemini-3.6]

  - <<: *generation-defaults
    id: kimi-k2.7-code
    name: Kimi K2.7 Code
    model: kimi-k2.7-code
    aliases: [kimi-2.7]

  - <<: *generation-defaults
    id: kimi-k3
    name: Kimi K3
    model: kimi-k3
    aliases: [kimi]

  - <<: *generation-defaults
    id: grok-4.6
    name: Grok 4.6
    model: grok-4.6
    aliases: [grok]
    supersedes: [grok-4.5]

  - <<: *generation-defaults
    id: claude-opus-4-6
    name: Claude Opus 4.6
    model: claude-opus-4-6
    aliases: [opus-4.6]
    protocol: anthropic-messages
    protocol_required:
      max_tokens: 65536

  - <<: *generation-defaults
    id: claude-opus-4-7
