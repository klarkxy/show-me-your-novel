# show-me-your-novel V2.1
#
# The endpoint and credential live in API_URL and API_KEY.  This file contains
# environment-variable names only; no credential value belongs in the repo.

version: 2

providers:
  new-api:
    base_url_env: API_URL
    api_key_env: API_KEY
    timeout: 600
    request_defaults: {}

# Generation controls intentionally stay empty so the upstream model uses its
# normal defaults for reasoning, temperature, and response format. Most models
# use Chat Completions; MiniMax and Claude explicitly select Anthropic Messages.
# Its required max_tokens is protocol metadata, not a chapter-length policy.
x-generation-defaults: &generation-defaults
  provider: new-api
  # Use a conservative common budget even when the upstream model supports
  # more. The runner refuses a request above 85% of this configured window.
  context_window: 131072
  request: {}
  stages: {}

models:
  - <<: *generation-defaults
    id: deepseek-v4-flash
    name: DeepSeek V4 Flash
    model: deepseek-v4-flash
    aliases: [deepseek-flash]

  - <<: *generation-defaults
    id: deepseek-v4-pro
    name: DeepSeek V4 Pro
    model: deepseek-v4-pro
    aliases: [deepseek-pro]

  - <<: *generation-defaults
    id: mimo-v2.5
    name: MiMo V2.5
    model: mimo-v2.5
    aliases: [mimo]

  - <<: *generation-defaults
    id: mimo-v2.5-pro
    name: MiMo V2.5 Pro
    model: mimo-v2.5-pro
    aliases: [mimo-pro]

  - <<: *generation-defaults
    id: minimax-m3
    name: MiniMax M3
    model: minimax-m3
    aliases: [minimax]
    protocol: anthropic-messages
    protocol_required:
      max_tokens: 204800
    context_window: 204800

  - <<: *generation-defaults
    id: glm-5.2
    name: GLM 5.2
    model: glm-5.2
    aliases: [glm]

  - <<: *generation-defaults
    id: gpt-5.6-luna
    name: GPT-5.6 Luna
    model: gpt-5.6-luna
    aliases: [luna]

  - <<: *generation-defaults
    id: claude-haiku-4-5
    name: Claude Haiku 4.5
    model: claude-haiku-4-5
    aliases: [haiku]
    protocol: anthropic-messages
    protocol_required:
      max_tokens: 65536

  - <<: *generation-defaults
    id: claude-sonnet-5
    name: Claude Sonnet 5
    model: claude-sonnet-5
    aliases: [sonnet]
    protocol: anthropic-messages
    protocol_required:
      max_tokens: 65536

  - <<: *generation-defaults
    id: gemini-3.1-pro
    name: Gemini 3.1 Pro
    model: gemini-3.1-pro
    aliases: [gemini-pro]

  - <<: *generation-defaults
    id: gemini-3.5-flash
    name: Gemini 3.5 Flash
    model: gemini-3.5-flash
    aliases: [gemini-flash]

  - <<: *generation-defaults
    id: kimi-k3
    name: Kimi K3
    model: kimi-k3
    aliases: [kimi]

  - <<: *generation-defaults
    id: grok-4.5
    name: Grok 4.5
    model: grok-4.5
    aliases: [grok]

  - <<: *generation-defaults
    id: claude-opus-4-8
    name: Claude Opus 4.8
    model: claude-opus-4-8
    aliases: [opus]
    protocol: anthropic-messages
    protocol_required:
      max_tokens: 65536

  - <<: *generation-defaults
    id: agnes-2.0-flash
    name: Agnes 2.0 Flash
    model: agnes-2.0-flash
    aliases: [agnes]

x-judge-defaults: &judge-defaults
  provider: new-api
  request:
    max_tokens: 4096
  stages:
    judge:
      temperature: 0.2
      response_format:
        type: json_object

judges:
  - <<: *judge-defaults
    id: sol
    name: Sol
    model: gpt-5.6-sol

  - <<: *judge-defaults
    id: fable
    name: Fable
    model: claude-fable-5
    protocol: anthropic-messages
    protocol_required:
      max_tokens: 4096
    request: {}
    stages:
      judge:
        temperature: 0.2

  - <<: *judge-defaults
    id: kimi
    name: Kimi
    model: kimi-k3
    # Kimi K3 rejects explicit non-1 temperatures. Omit the field so the
    # upstream model keeps its required default while retaining JSON mode.
    stages:
      judge:
        response_format:
          type: json_object
