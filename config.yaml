  - <<: *generation-defaults
    id: claude-opus-5
    name: Claude Opus 5
    model: claude-opus-5
    aliases: [opus]
    protocol: anthropic-messages
    protocol_required:
      max_tokens: 65536

  - <<: *generation-defaults
    id: agnes-2.5-flash
    name: Agnes 2.5 Flash
    model: agnes-2.5-flash
    aliases: [agnes, agnes-2.5]

x-judge-defaults: &judge-defaults
  provider: new-api
  request:
    max_tokens: 4096
  stages:
    judge:
      temperature: 0.2
      response_format:
        type: json_object

judges:
  - <<: *judge-defaults
    id: sol
    name: Sol
    model: gpt-5.6-sol

  - <<: *judge-defaults
    id: grok
    name: Grok 4.6
    model: grok-4.6
    # This Grok route injects tool_choice even when the client sends no tools.
    # Supply one disabled placeholder so the upstream request remains valid;
    # the judge cannot call it and its JSON output is still validated locally.
    stages:
      judge:
        temperature: 0.2
        tools:
          - type: function
            function:
              name: unused_judge_tool
              description: Never call this tool.
              parameters:
                type: object
                properties: {}
                additionalProperties: false
        tool_choice: none

  - <<: *judge-defaults
    id: opus
    name: Claude Opus 5
    model: claude-opus-5
    protocol: anthropic-messages
    protocol_required:
      max_tokens: 16384
    request: {}
    stages:
      judge:
        temperature: 0.2

  - <<: *judge-defaults
    id: k3
    name: Kimi K3
    model: kimi-k3
    # K3 rejects explicit non-1 temperatures and may spend most of a 4096-token
    # budget on private reasoning, so omit temperature and give the JSON room.
    request:
      max_tokens: 8192
    stages:
      judge:
        response_format:
          type: json_object

  - <<: *judge-defaults
    id: ds-v4-pro
    name: DeepSeek V4 Pro
    model: deepseek-v4-pro
    # Full-manuscript self-review can exhaust the shared 4096-token default.
    # Reserve enough room for the complete public JSON; truncation still fails.
    request:
      max_tokens: 8192
